name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - runtime: osx-arm64
            os: macos-latest
            archive: tar.gz
          - runtime: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - runtime: win-x64
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/CashFlow/CashFlow.Cli/CashFlow.Cli.csproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            --output artifacts/${{ matrix.runtime }}

      - name: Create archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd artifacts/${{ matrix.runtime }}
          tar -czf ../cashflow-${{ github.ref_name }}-${{ matrix.runtime }}.tar.gz cashflow

      - name: Create Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/${{ matrix.runtime }}/cashflow.exe `
            -DestinationPath artifacts/cashflow-${{ github.ref_name }}-${{ matrix.runtime }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-${{ matrix.runtime }}
          path: |
            artifacts/cashflow-${{ github.ref_name }}-${{ matrix.runtime }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
